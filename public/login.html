<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Banana Puzzle Challenge</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 32px;
    }
    .auth-tab-bar {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #000000;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-muted);
      display: flex;
      justify-content: space-between;
    }
    .form-control {
      background: #000;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }
    .form-control:focus {
      border-color: var(--color-border-focus);
    }
    .password-wrapper {
      position: relative;
    }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-dim);
      cursor: pointer;
    }
    .auth-alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      margin-bottom: 18px;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <span style="font-size: 2.2rem; display: inline-block; margin-bottom: 6px;">🍌</span>
      <h1 style="font-size: 1.4rem; font-weight: 700;">Banana Puzzle</h1>
      <p class="text-muted" style="font-size: 0.85rem;">Virtual Identity &amp; High Score Tracking</p>
    </div>

    <!-- Tab Bar -->
    <div class="auth-tab-bar">
      <button class="tab-btn active" data-tab="login">Sign In</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <!-- Alert Message -->
    <div id="authAlert" class="auth-alert hidden">
      <span id="authAlertText"></span>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="you@domain.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pw" data-target="loginPassword"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
        <i class="fa-solid fa-spinner fa-spin btn-spinner hidden"></i>
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regName">Display Name <span class="text-muted" style="font-weight: 400;">(Shown on Leaderboard)</span></label>
        <input type="text" id="regName" class="form-control" placeholder="e.g. MasterSolver" required maxlength="30" autocomplete="nickname">
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="you@domain.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="regPassword">Password <span class="text-muted" style="font-weight: 400;">(Min. 6 chars)</span></label>
        <div class="password-wrapper">
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-pw" data-target="regPassword"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label for="regConfirm">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="regConfirm" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-pw" data-target="regConfirm"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        <i class="fa-solid fa-user-plus"></i> Create Account
        <i class="fa-solid fa-spinner fa-spin btn-spinner hidden"></i>
      </button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
